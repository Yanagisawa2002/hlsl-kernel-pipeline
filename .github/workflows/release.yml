name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  packages:
    runs-on: windows-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore HlslKernelPipeline.slnx
      - name: Build
        run: dotnet build HlslKernelPipeline.slnx -c Release --no-restore
      - name: Test
        run: dotnet test HlslKernelPipeline.slnx -c Release --no-build
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $props = [xml](Get-Content -Raw Directory.Build.props)
          $packageVersion = [string]$props.Project.PropertyGroup.PackageVersion
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Tag '$env:RELEASE_TAG' does not match package version '$packageVersion'."
          }
      - name: Pack SDK and CLI
        run: dotnet pack HlslKernelPipeline.slnx -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: hlslperf-${{ github.ref_name }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish tagged release to NuGet
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY != ''
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
